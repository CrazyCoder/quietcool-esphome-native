# Build the credential-free factory firmware and publish it together with the
# Web BLE installer and managed-update manifest to GitHub Pages.
#
# Every push to main redeploys (requires Settings → Pages → Source: "GitHub
# Actions", and a public repo — private Pages needs a paid plan).
#
# What gets published is decided by firmware-version.yaml, not by whether the
# firmware bytes changed. While that version matches the latest release, the
# site keeps serving the released image: a firmware change lands on main, gets
# compiled here so a build break still fails CI, and its bytes are discarded.
# Bumping firmware-version.yaml is what turns the next push into a release.
# That keeps "version" a unique name for one exact image, which the managed
# update entity depends on, without forcing a release for every firmware edit.
name: Deploy Web installer

env:
  ESPHOME_VERSION: "2026.7.4"

on:
  workflow_dispatch:
  push:
    branches: [main]

# Least privilege + what the Pages deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deploys at once; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Capture this before ESPHome imports local components: Python may create
      # __pycache__ files under components/ during the build, and those generated
      # files must not make an unchanged source tree look like new firmware.
      - name: Fingerprint firmware inputs
        id: firmware-inputs
        shell: bash
        run: |
          input_hash="$(
            git ls-files --stage -- \
                quietcool-atticfan.factory.yaml quietcool-atticfan.yaml \
                firmware-version.yaml wifi-dist.yaml creds-dist.yaml \
                partitions.csv components \
              | awk 'index($4, "/test/") == 0' \
              | sha256sum \
              | awk '{print $1}'
          )"
          echo "hash=$input_hash" >> "$GITHUB_OUTPUT"

      # Decide whether this push publishes firmware. While firmware-version.yaml
      # still names the latest release, stage that release's binary and keep the
      # site on it. Two reasons to prefer the published bytes over a rebuild:
      # ESPHome builds are not byte-reproducible, so even an unchanged source
      # tree yields a different image, and republishing different bytes under an
      # unchanged version would make that version ambiguous for the managed
      # update entity. Bumping the version is what selects a fresh build.
      #
      # `validate` marks the case where the inputs did change under an unbumped
      # version: compile anyway so a build break fails CI, then throw the image
      # away.
      - name: Resolve firmware to publish
        id: fw-published
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FIRMWARE_INPUT_HASH: ${{ steps.firmware-inputs.outputs.hash }}
        shell: bash
        run: |
          set -euo pipefail
          reused=false
          validate=false
          current_fingerprint="${ESPHOME_VERSION}:${FIRMWARE_INPUT_HASH}"
          fingerprint="$current_fingerprint"
          current_version="$(tr -d '"[:space:]' < firmware-version.yaml)"
          latest_tag="$(
            gh release list --limit 100 --exclude-drafts --exclude-pre-releases \
              --json tagName \
              --jq '[.[] | select(.tagName | startswith("qc-esphome-"))] | first | .tagName // ""'
          )"
          published_version="${latest_tag#qc-esphome-}"
          if [[ -z "$latest_tag" ]]; then
            echo "No published firmware release yet; building for first publication."
          elif [[ "$published_version" != "$current_version" ]]; then
            echo "firmware-version.yaml is $current_version, published is $published_version; building for release."
          else
            published="$RUNNER_TEMP/published-firmware"
            mkdir -p "$published"
            if gh release download "$latest_tag" \
                --pattern 'qc-esphome-*' --dir "$published"; then
              fp_file="$(find "$published" -maxdepth 1 -type f -name 'qc-esphome-*.build-fingerprint' -print -quit)"
              bin_file="$(find "$published" -maxdepth 1 -type f -name 'qc-esphome-*.bin' -print -quit)"
              md5_file="$(find "$published" -maxdepth 1 -type f -name 'qc-esphome-*.bin.md5' -print -quit)"
              if [[ -n "$fp_file" && -n "$bin_file" && -n "$md5_file" ]] \
                  && [[ "$(md5sum "$bin_file" | awk '{print $1}')" == "$(tr -d '[:space:]' < "$md5_file")" ]]; then
                cp "$bin_file" web-installer/firmware.ota.bin
                md5sum web-installer/firmware.ota.bin | awk '{print $1}' \
                  > web-installer/firmware.ota.bin.md5
                reused=true
                # Describe the bytes we actually ship, not the tree that built them.
                fingerprint="$(tr -d '[:space:]' < "$fp_file")"
                if [[ "$fingerprint" == "$current_fingerprint" ]]; then
                  echo "Inputs unchanged; serving $latest_tag."
                else
                  validate=true
                  echo "Firmware inputs changed while firmware-version.yaml is still $current_version." \
                       "Compiling to validate, and serving $latest_tag. Bump the version to publish." \
                    | tee -a "$GITHUB_STEP_SUMMARY"
                fi
              else
                echo "::warning::Assets of $latest_tag are incomplete or corrupt; building instead"
              fi
            else
              echo "::warning::Could not download assets of $latest_tag; building instead"
            fi
          fi
          echo "reused=$reused" >> "$GITHUB_OUTPUT"
          echo "validate=$validate" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      # Reuse the previously-built firmware when nothing that feeds the dist
      # build has changed — site-only pushes then skip the whole ESP-IDF
      # toolchain (~4-5 min) and deploy in well under a minute. The key hashes
      # every input of the dist build (dev-only files like wifi-dev.yaml and
      # host-side component tests are deliberately excluded) plus this workflow
      # file, so an ESPHome version bump below forces a rebuild. If GitHub
      # evicts the cache (~7 days unused), the next push just rebuilds once.
      # Skipped when the published image was reused above — restoring the cache
      # would overwrite the staged files.
      - name: Restore built firmware
        id: fw-cache
        if: steps.fw-published.outputs.reused != 'true'
        uses: actions/cache@v6
        with:
          path: |
            web-installer/firmware.ota.bin
            web-installer/firmware.ota.bin.md5
          key: fw-${{ hashFiles('quietcool-atticfan.factory.yaml', 'quietcool-atticfan.yaml', 'firmware-version.yaml', 'wifi-dist.yaml', 'creds-dist.yaml', 'partitions.csv', 'components/**', '!components/**/test/**', '.github/workflows/deploy-pages.yml') }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Cache the ESP-IDF toolchain (large, and stable for a pinned ESPHome
      # version). ESPHome 2026.7 builds ESP32 with native ESP-IDF by default and
      # installs it under platformdirs' user cache — ~/.cache/esphome/idf on the
      # runner — so that path must be cached or every run re-downloads the whole
      # toolchain. ~/.platformio stays for the pre-2026.7 layout.
      # We deliberately do NOT cache .esphome/: its generated C++ can go stale
      # across config changes, and `esphome clean` does not clear it — a
      # from-scratch build guarantees the artifact matches the source.
      - name: Cache ESP-IDF toolchain
        if: steps.fw-published.outputs.validate == 'true' || (steps.fw-published.outputs.reused != 'true' && steps.fw-cache.outputs.cache-hit != 'true')
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/esphome
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-esphome-${{ env.ESPHOME_VERSION }}
          restore-keys: pio-${{ runner.os }}-

      # Pinned for reproducible firmware artifacts. Bump this (and the cache key
      # above) in lockstep with the version you build/test with locally.
      - name: Install ESPHome
        if: steps.fw-published.outputs.validate == 'true' || (steps.fw-published.outputs.reused != 'true' && steps.fw-cache.outputs.cache-hit != 'true')
        run: pip install "esphome==${ESPHOME_VERSION}"

      # The factory wrapper selects the secret-free packages and adds the
      # GitHub-managed update entity. It needs no secrets.yaml and bakes in no
      # Wi-Fi credentials, API key, or OTA password.
      # When `validate` is set this compiles purely as a build check: the image
      # is never staged, and the published one ships instead.
      - name: Build dist firmware
        if: steps.fw-published.outputs.validate == 'true' || (steps.fw-published.outputs.reused != 'true' && steps.fw-cache.outputs.cache-hit != 'true')
        run: esphome compile quietcool-atticfan.factory.yaml

      - name: Stage firmware + checksum next to the installer
        if: steps.fw-published.outputs.reused != 'true' && steps.fw-cache.outputs.cache-hit != 'true'
        run: |
          # ESPHome 2026.7 builds ESP32 with native ESP-IDF and writes to
          # build/; the PlatformIO toolchain wrote to .pioenvs/<name>/. Accept
          # either, and fail loudly rather than staging a stale image if a
          # future layout change moves it again.
          ROOT=.esphome/build/quietcool-atticfan
          BIN=""
          for candidate in \
            "$ROOT/build/firmware.ota.bin" \
            "$ROOT/.pioenvs/quietcool-atticfan/firmware.ota.bin"; do
            if [[ -f "$candidate" ]]; then BIN="$candidate"; break; fi
          done
          if [[ -z "$BIN" ]]; then
            echo "::error::firmware.ota.bin not found under $ROOT"
            find "$ROOT" -name 'firmware*.bin' -printf '  %p\n' 2>/dev/null || true
            exit 1
          fi
          echo "Using $BIN"
          cp "$BIN" web-installer/firmware.ota.bin
          md5sum "$BIN" | awk '{print $1}' > web-installer/firmware.ota.bin.md5
          echo "Staged firmware ($(du -h "$BIN" | cut -f1)), md5 $(cat web-installer/firmware.ota.bin.md5)"

      - name: Generate managed-update manifest
        shell: bash
        run: |
          args=()
          previous="$RUNNER_TEMP/previous-update-manifest.json"
          if curl --fail --silent --show-error \
              https://crazycoder.github.io/quietcool-esphome-native/manifest.json \
              --output "$previous"; then
            args+=(--previous-manifest "$previous")
          else
            echo "No previous managed-update manifest; treating this as the first publication."
          fi
          python scripts/generate_update_manifest.py "${args[@]}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web-installer

      # The fingerprint describes the staged bytes, so when the published image
      # was reused it carries that release's fingerprint rather than this tree's.
      # The release job compares it to decide whether anything new exists.
      - name: Prepare firmware release artifact
        env:
          FIRMWARE_FINGERPRINT: ${{ steps.fw-published.outputs.fingerprint }}
        shell: bash
        run: |
          mkdir release-artifact
          cp web-installer/firmware.ota.bin release-artifact/
          cp web-installer/firmware.ota.bin.md5 release-artifact/
          cp firmware-version.yaml release-artifact/
          printf '%s\n' "$FIRMWARE_FINGERPRINT" \
            > release-artifact/firmware.build-fingerprint

      # Preserve the exact dist image outside the Pages tarball so the release
      # job can compare and archive it after the live installer is deployed.
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-firmware
          path: release-artifact
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

  release:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v8
        with:
          name: dist-firmware
          path: dist

      # A cache miss does not necessarily mean new firmware: cache eviction and
      # workflow-only edits can rebuild from the same inputs, while build-time
      # metadata can make those bytes differ. Compare both the input fingerprint
      # and the image with the latest firmware release to avoid duplicates.
      - name: Check for a new firmware image
        id: firmware
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          bin="dist/firmware.ota.bin"
          current_sha="$(sha256sum "$bin" | awk '{print $1}')"
          current_fingerprint="$(tr -d '[:space:]' < dist/firmware.build-fingerprint)"
          firmware_version="$(tr -d '"[:space:]' < dist/firmware-version.yaml)"
          expected_md5="$(tr -d '[:space:]' < dist/firmware.ota.bin.md5)"
          actual_md5="$(md5sum "$bin" | awk '{print $1}')"
          if [[ "$actual_md5" != "$expected_md5" ]]; then
            echo "::error::Staged firmware MD5 does not match its checksum file"
            exit 1
          fi

          latest_tag="$(
            gh release list --limit 100 --exclude-drafts --exclude-pre-releases \
              --json tagName \
              --jq '[.[] | select(.tagName | startswith("qc-esphome-"))] | first | .tagName // ""'
          )"
          changed=true

          if [[ -n "$latest_tag" ]]; then
            mkdir previous
            if gh release download "$latest_tag" \
                --pattern 'qc-esphome-*' --dir previous; then
              previous_bin="$(find previous -maxdepth 1 -type f -name 'qc-esphome-*.bin' -print -quit)"
              previous_fingerprint_file="$(find previous -maxdepth 1 -type f -name 'qc-esphome-*.build-fingerprint' -print -quit)"
              previous_fingerprint=""
              if [[ -n "$previous_fingerprint_file" ]]; then
                previous_fingerprint="$(tr -d '[:space:]' < "$previous_fingerprint_file")"
              fi

              if [[ -n "$previous_fingerprint" ]] && \
                  [[ "$previous_fingerprint" == "$current_fingerprint" ]]; then
                changed=false
              elif [[ -n "$previous_bin" ]] && \
                  [[ "$(sha256sum "$previous_bin" | awk '{print $1}')" == "$current_sha" ]]; then
                changed=false
              fi
            else
              echo "::warning::Latest firmware release has no matching binary; publishing this build"
            fi
          fi

          # Asset file names also carry the ESPHome toolchain version (the
          # fingerprint's first field, always matching the staged binary) so
          # downloaders can tell which ESPHome release produced the image.
          esphome_version="${current_fingerprint%%:*}"
          stem="qc-esphome-${firmware_version}"
          asset_stem="${stem}-esphome-${esphome_version}"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "stem=$stem" >> "$GITHUB_OUTPUT"
          echo "asset_stem=$asset_stem" >> "$GITHUB_OUTPUT"
          echo "sha256=$current_sha" >> "$GITHUB_OUTPUT"

          if [[ "$changed" == "false" ]]; then
            echo "Firmware inputs or image match $latest_tag; no release needed." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Prepare release assets
        if: steps.firmware.outputs.changed == 'true'
        env:
          ASSET_STEM: ${{ steps.firmware.outputs.asset_stem }}
          SHA256: ${{ steps.firmware.outputs.sha256 }}
        shell: bash
        run: |
          cp dist/firmware.ota.bin "$ASSET_STEM.bin"
          cp dist/firmware.ota.bin.md5 "$ASSET_STEM.bin.md5"
          printf '%s\n' "$SHA256" > "$ASSET_STEM.bin.sha256"
          cp dist/firmware.build-fingerprint "$ASSET_STEM.build-fingerprint"

      - name: Publish firmware release
        if: steps.firmware.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          STEM: ${{ steps.firmware.outputs.stem }}
          ASSET_STEM: ${{ steps.firmware.outputs.asset_stem }}
          PREVIOUS_TAG: ${{ steps.firmware.outputs.latest_tag }}
          SHA256: ${{ steps.firmware.outputs.sha256 }}
        shell: bash
        run: |
          args=(
            "$STEM"
            "$ASSET_STEM.bin"
            "$ASSET_STEM.bin.md5"
            "$ASSET_STEM.bin.sha256"
            "$ASSET_STEM.build-fingerprint"
            --target "$GITHUB_SHA"
            --title "$STEM"
            --generate-notes
            --latest
          )
          if [[ -n "$PREVIOUS_TAG" ]]; then
            args+=(--notes-start-tag "$PREVIOUS_TAG")
          fi

          gh release create "${args[@]}"
          release_url="$(gh release view "$STEM" --json url --jq .url)"
          {
            echo "Published [$STEM]($release_url)."
            echo
            echo "SHA-256: \`$SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"
