# Build the credential-free factory firmware and publish it together with the
# Web BLE installer and managed-update manifest to GitHub Pages.
#
# Every push to main redeploys (requires Settings → Pages → Source: "GitHub
# Actions", and a public repo — private Pages needs a paid plan).
name: Deploy Web installer

env:
  ESPHOME_VERSION: "2026.6.5"

on:
  workflow_dispatch:
  push:
    branches: [main]

# Least privilege + what the Pages deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deploys at once; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Capture this before ESPHome imports local components: Python may create
      # __pycache__ files under components/ during the build, and those generated
      # files must not make an unchanged source tree look like new firmware.
      - name: Fingerprint firmware inputs
        id: firmware-inputs
        shell: bash
        run: |
          input_hash="$(
            git ls-files --stage -- \
                quietcool-atticfan.factory.yaml quietcool-atticfan.yaml \
                firmware-version.yaml wifi-dist.yaml creds-dist.yaml \
                partitions.csv components \
              | awk 'index($4, "/test/") == 0' \
              | sha256sum \
              | awk '{print $1}'
          )"
          echo "hash=$input_hash" >> "$GITHUB_OUTPUT"

      # Reuse the previously-built firmware when nothing that feeds the dist
      # build has changed — site-only pushes then skip the whole ESP-IDF
      # toolchain (~4-5 min) and deploy in well under a minute. The key hashes
      # every input of the dist build (dev-only files like wifi-dev.yaml and
      # host-side component tests are deliberately excluded) plus this workflow
      # file, so an ESPHome version bump below forces a rebuild. If GitHub
      # evicts the cache (~7 days unused), the next push just rebuilds once.
      - name: Restore built firmware
        id: fw-cache
        uses: actions/cache@v6
        with:
          path: |
            web-installer/firmware.ota.bin
            web-installer/firmware.ota.bin.md5
          key: fw-${{ hashFiles('quietcool-atticfan.factory.yaml', 'quietcool-atticfan.yaml', 'firmware-version.yaml', 'wifi-dist.yaml', 'creds-dist.yaml', 'partitions.csv', 'components/**', '!components/**/test/**', '.github/workflows/deploy-pages.yml') }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Cache the ESP-IDF / PlatformIO toolchain (large, and stable for a pinned
      # ESPHome version). We deliberately do NOT cache .esphome/: its generated
      # C++ can go stale across config changes, and `esphome clean` does not clear
      # it — a from-scratch build guarantees the artifact matches the source.
      - name: Cache PlatformIO toolchain
        if: steps.fw-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-esphome-${{ env.ESPHOME_VERSION }}
          restore-keys: pio-${{ runner.os }}-

      # Pinned for reproducible firmware artifacts. Bump this (and the cache key
      # above) in lockstep with the version you build/test with locally.
      - name: Install ESPHome
        if: steps.fw-cache.outputs.cache-hit != 'true'
        run: pip install "esphome==${ESPHOME_VERSION}"

      # The factory wrapper selects the secret-free packages and adds the
      # GitHub-managed update entity. It needs no secrets.yaml and bakes in no
      # Wi-Fi credentials, API key, or OTA password.
      - name: Build dist firmware
        if: steps.fw-cache.outputs.cache-hit != 'true'
        run: esphome compile quietcool-atticfan.factory.yaml

      - name: Stage firmware + checksum next to the installer
        if: steps.fw-cache.outputs.cache-hit != 'true'
        run: |
          BIN=.esphome/build/quietcool-atticfan/.pioenvs/quietcool-atticfan/firmware.ota.bin
          test -f "$BIN" || { echo "::error::firmware.ota.bin not found at $BIN"; exit 1; }
          cp "$BIN" web-installer/firmware.ota.bin
          md5sum "$BIN" | awk '{print $1}' > web-installer/firmware.ota.bin.md5
          echo "Staged firmware ($(du -h "$BIN" | cut -f1)), md5 $(cat web-installer/firmware.ota.bin.md5)"

      - name: Generate managed-update manifest
        shell: bash
        run: |
          args=()
          previous="$RUNNER_TEMP/previous-update-manifest.json"
          if curl --fail --silent --show-error \
              https://crazycoder.github.io/quietcool-esphome-native/manifest.json \
              --output "$previous"; then
            args+=(--previous-manifest "$previous")
          else
            echo "No previous managed-update manifest; treating this as the first publication."
          fi
          python scripts/generate_update_manifest.py "${args[@]}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web-installer

      - name: Prepare firmware release artifact
        env:
          FIRMWARE_INPUT_HASH: ${{ steps.firmware-inputs.outputs.hash }}
        shell: bash
        run: |
          mkdir release-artifact
          cp web-installer/firmware.ota.bin release-artifact/
          cp web-installer/firmware.ota.bin.md5 release-artifact/
          cp firmware-version.yaml release-artifact/
          printf '%s:%s\n' "$ESPHOME_VERSION" "$FIRMWARE_INPUT_HASH" \
            > release-artifact/firmware.build-fingerprint

      # Preserve the exact dist image outside the Pages tarball so the release
      # job can compare and archive it after the live installer is deployed.
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-firmware
          path: release-artifact
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

  release:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v8
        with:
          name: dist-firmware
          path: dist

      # A cache miss does not necessarily mean new firmware: cache eviction and
      # workflow-only edits can rebuild from the same inputs, while build-time
      # metadata can make those bytes differ. Compare both the input fingerprint
      # and the image with the latest firmware release to avoid duplicates.
      - name: Check for a new firmware image
        id: firmware
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          bin="dist/firmware.ota.bin"
          current_sha="$(sha256sum "$bin" | awk '{print $1}')"
          current_fingerprint="$(tr -d '[:space:]' < dist/firmware.build-fingerprint)"
          firmware_version="$(tr -d '"[:space:]' < dist/firmware-version.yaml)"
          expected_md5="$(tr -d '[:space:]' < dist/firmware.ota.bin.md5)"
          actual_md5="$(md5sum "$bin" | awk '{print $1}')"
          if [[ "$actual_md5" != "$expected_md5" ]]; then
            echo "::error::Staged firmware MD5 does not match its checksum file"
            exit 1
          fi

          latest_tag="$(
            gh release list --limit 100 --exclude-drafts --exclude-pre-releases \
              --json tagName \
              --jq '[.[] | select(.tagName | startswith("qc-esphome-"))] | first | .tagName // ""'
          )"
          changed=true

          if [[ -n "$latest_tag" ]]; then
            mkdir previous
            if gh release download "$latest_tag" \
                --pattern 'qc-esphome-*' --dir previous; then
              previous_bin="$(find previous -maxdepth 1 -type f -name 'qc-esphome-*.bin' -print -quit)"
              previous_fingerprint_file="$(find previous -maxdepth 1 -type f -name 'qc-esphome-*.build-fingerprint' -print -quit)"
              previous_fingerprint=""
              if [[ -n "$previous_fingerprint_file" ]]; then
                previous_fingerprint="$(tr -d '[:space:]' < "$previous_fingerprint_file")"
              fi

              if [[ -n "$previous_fingerprint" ]] && \
                  [[ "$previous_fingerprint" == "$current_fingerprint" ]]; then
                changed=false
              elif [[ -n "$previous_bin" ]] && \
                  [[ "$(sha256sum "$previous_bin" | awk '{print $1}')" == "$current_sha" ]]; then
                changed=false
              fi
            else
              echo "::warning::Latest firmware release has no matching binary; publishing this build"
            fi
          fi

          # Asset file names also carry the ESPHome toolchain version (the
          # fingerprint's first field, always matching the staged binary) so
          # downloaders can tell which ESPHome release produced the image.
          esphome_version="${current_fingerprint%%:*}"
          stem="qc-esphome-${firmware_version}"
          asset_stem="${stem}-esphome-${esphome_version}"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "stem=$stem" >> "$GITHUB_OUTPUT"
          echo "asset_stem=$asset_stem" >> "$GITHUB_OUTPUT"
          echo "sha256=$current_sha" >> "$GITHUB_OUTPUT"

          if [[ "$changed" == "false" ]]; then
            echo "Firmware inputs or image match $latest_tag; no release needed." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Prepare release assets
        if: steps.firmware.outputs.changed == 'true'
        env:
          ASSET_STEM: ${{ steps.firmware.outputs.asset_stem }}
          SHA256: ${{ steps.firmware.outputs.sha256 }}
        shell: bash
        run: |
          cp dist/firmware.ota.bin "$ASSET_STEM.bin"
          cp dist/firmware.ota.bin.md5 "$ASSET_STEM.bin.md5"
          printf '%s\n' "$SHA256" > "$ASSET_STEM.bin.sha256"
          cp dist/firmware.build-fingerprint "$ASSET_STEM.build-fingerprint"

      - name: Publish firmware release
        if: steps.firmware.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          STEM: ${{ steps.firmware.outputs.stem }}
          ASSET_STEM: ${{ steps.firmware.outputs.asset_stem }}
          PREVIOUS_TAG: ${{ steps.firmware.outputs.latest_tag }}
          SHA256: ${{ steps.firmware.outputs.sha256 }}
        shell: bash
        run: |
          args=(
            "$STEM"
            "$ASSET_STEM.bin"
            "$ASSET_STEM.bin.md5"
            "$ASSET_STEM.bin.sha256"
            "$ASSET_STEM.build-fingerprint"
            --target "$GITHUB_SHA"
            --title "$STEM"
            --generate-notes
            --latest
          )
          if [[ -n "$PREVIOUS_TAG" ]]; then
            args+=(--notes-start-tag "$PREVIOUS_TAG")
          fi

          gh release create "${args[@]}"
          release_url="$(gh release view "$STEM" --json url --jq .url)"
          {
            echo "Published [$STEM]($release_url)."
            echo
            echo "SHA-256: \`$SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"
