# Remote component source, selected by `components_source: git` (the default).
# An adopted Device Builder install consumes quietcool-atticfan.yaml as a remote
# package, so `type: local` would resolve `components/` against the user's own
# configuration directory. Fetching the same repository directly keeps the C++
# available wherever the YAML is used.
#
# `components_ref` defaults to `main`, matching the ref dashboard_import writes
# into the generated per-device configuration. If you pin your package line to a
# release tag, set the same tag in your device's `substitutions:` so the C++ and
# the YAML come from one commit.
#
# Neither this file nor components-local.yaml names the components, so the two
# sources cannot drift apart: a component missing from only one of them would
# break just the path that file serves.

external_components:
  - source:
      type: git
      url: https://github.com/CrazyCoder/quietcool-esphome-native
      ref: ${components_ref}
