# Distribution-build credentials package — adds no api.encryption.key and
# no ota password. Devices shipped from this build come up with:
#   - api:  unencrypted on first contact (HA discovers via mDNS)
#   - ota:  password-less (the project intentionally uses a LAN-trust default)
#
# ESPHome Device Builder's Take Control flow creates a local wrapper and can
# add a per-device API encryption key. Current Device Builder does not generate
# an ota.esphome password, so OTA and the web server remain LAN-trust surfaces
# unless the user explicitly customizes the adopted configuration.
#
# Used by quietcool-atticfan.yaml and quietcool-atticfan.factory.yaml.

# An OTA block IS required (you can't `ota: []`), but it can be
# password-less. The adopted wrapper can override it if the user wants one.
ota:
  - platform: esphome
  # http_request OTA — enables the stock-restore action wired in the main YAML.
  # ESPHome packages append list entries during merge, so this coexists with the
  # esphome OTA above. `id:` lets the http_flash_handler external component
  # (POST /api/flash_url) drive this OTA programmatically with any URL.
  - platform: http_request
    id: http_ota
