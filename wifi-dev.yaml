# Development-build Wi-Fi config — has creds compiled in via secrets.yaml.
# Selected by quietcool-atticfan.dev.yaml. The public and factory wrappers use
# wifi-dist.yaml instead so their binaries contain no private credentials.

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Fallback AP — comes up when no STA connection can be established (e.g.
  # router down). Same SSID on both dev and dist builds so the Web BLE
  # installer can locate the device regardless of build mode.
  ap:
    ssid: "QuietCool Setup"
    # Fallback AP (and Improv-BLE re-provisioning) come up 90 s after the
    # last good STA connection drops — long enough to ride out a router
    # reboot without flapping into AP mode.
    ap_timeout: 90s
